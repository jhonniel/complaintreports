name: Keep Supabase awake

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production keep-alive
        env:
          KEEP_ALIVE_URL: https://complaintreports.vercel.app/api/health
        run: curl -fsS --retry 1 --retry-all-errors --retry-delay 8 --max-time 35 "$KEEP_ALIVE_URL"
